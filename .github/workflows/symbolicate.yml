name: sweet-symbolicate

# Names the stack frames the kernel sampler prints ("SMP ... bt 0x..." lines of boot.txt).
# The shared cache and its symbols come from the IPSW of tools/sweet-root-tweaks.py's iOS build;
# frames inside backboardd / SpringBoard / datamigrator get a disassembly window around the call.
# Result: the job summary (and the log). Takes about 25 minutes (IPSW download + APFS read).
#
# smp_text: the SMP lines from boot.txt, joined into ONE line with ';' between them, for example
#   SMP backboardd[56] slide 0x18100000 mh 0x104b54000;SMP backboardd t8 pc 0x... lr 0x... sp 0x... bt 0x... 0x...
on:
  workflow_dispatch:
    inputs:
      smp_text:
        description: "SMP lines from boot.txt, joined with ';' into one line"
        type: string
        required: true
      ipsw_url:
        description: "IPSW URL (empty = the build of tools/sweet-root-tweaks.py, found via ipsw.me)"
        type: string
        default: ""
      ipsw_sha256:
        description: "SHA-256 of that IPSW (needed with ipsw_url)"
        type: string
        default: ""
      runner:
        description: "Runner label"
        type: string
        default: "ubuntu-24.04"

permissions:
  contents: read

jobs:
  symbolicate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Runner space
        run: bash tools/ci/prepare-runner.sh 50

      - name: Packages
        run: |
          bash tools/ci/install-deps.sh
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends llvm

      - name: Find the IPSW
        id: ipsw
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          IPSW_SHA: ${{ inputs.ipsw_sha256 }}
        run: |
          args=()
          [ -n "$IPSW_URL" ] && args+=(--url "$IPSW_URL" --sha256 "$IPSW_SHA")
          python3 tools/ci/resolve-ipsw.py "${args[@]}"

      - name: Download the IPSW and extract the disk images
        env:
          IPSW_URL: ${{ steps.ipsw.outputs.url }}
          IPSW_SHA256: ${{ steps.ipsw.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK/ipsw"
          curl -fL --retry 8 --retry-delay 15 --retry-all-errors -C - -o "$WORK/ipsw/restore.ipsw" "$IPSW_URL"
          echo "$IPSW_SHA256  $WORK/ipsw/restore.ipsw" | sha256sum -c -
          python3 tools/ci/ipsw-images.py "$WORK/ipsw/restore.ipsw" "$WORK/ipsw"
          rm -f "$WORK/ipsw/restore.ipsw"
          ls -l "$WORK/ipsw"

      - name: APFS reader
        run: JOBS=$(nproc) bash tools/build-apfs-reader.sh

      - name: Symbolicate
        env:
          SMP_TEXT: ${{ inputs.smp_text }}
        run: |
          set -euo pipefail
          export APFS_FUSE="$PWD/research/apfs-fuse-current/build/apfs-fuse"
          test -x "$APFS_FUSE"
          m="$WORK/mnt"; mkdir -p "$m"
          # apfs-fuse only parses UDIF images when the name ends in .dmg
          for n in os sysos; do
            ln -s "$WORK/ipsw/$n.dmg" "$m/$n.dmg"; mkdir "$m/$n"
            sudo "$APFS_FUSE" "$m/$n.dmg" "$m/$n"
          done
          dsc="$m/sysos/root/System/Library/Caches/com.apple.dyld"
          echo "shared cache directory:"; sudo ls -l "$dsc" | head -20
          bins=()
          add() { # add SAMPLER-NAME FILE-NAME
            local f; f=$(sudo find "$m/os/root" -type f -name "$2" 2>/dev/null | head -1 || true)
            [ -z "$f" ] || { echo "binary $1: $f"; bins+=(--bin "$1=$f"); }
          }
          add backboardd backboardd
          add SpringBoard SpringBoard
          add com.apple.datami com.apple.datamigrator
          add com.apple.migrat com.apple.migrationpluginwrapper
          objdump=$(ls /usr/bin/llvm-objdump* | head -1)
          sudo python3 tools/ci/smp-symbolicate.py "$dsc" "$SMP_TEXT" "${bins[@]}" --disasm "$objdump" \
            | tee "$WORK/symbolicated.txt"
          {
            echo "### Symbolicated stacks"
            echo '```'
            head -c 900000 "$WORK/symbolicated.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for n in sysos os; do sudo umount "$m/$n" 2>/dev/null || true; done
